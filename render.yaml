services:
  - type: static_site
    name: royal-shepherd-frontend
    env: static
    branch: gh-pages
    plan: starter
    root: .
    publishPath: /
    buildCommand: echo "No build required"

  - type: web_service
    name: royal-shepherd-backend
    env: python
    branch: gh-pages
    plan: starter
    root: backend
    buildCommand: pip install -r requirements/requirements.txt
    startCommand: bash -lc "uvicorn main:app --host 0.0.0.0 --port \$PORT"
